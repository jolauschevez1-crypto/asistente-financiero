<h2 mat-dialog-title>{{ data.titulo }}</h2>
<mat-dialog-content>
    <p>{{ data.mensaje }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-stroked-button type="button" (click)="cancelar()">{{ data.textoCancelar || 'Cancelar' }}</button>
    <button
        mat-raised-button
        type="button"
        [color]="data.tono === 'warn' ? 'warn' : 'primary'"
        (click)="confirmar()"
    >
        {{ data.textoConfirmar || 'Confirmar' }}
    </button>
</mat-dialog-actions>
